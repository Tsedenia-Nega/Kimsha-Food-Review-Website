    <script>
    
   
    $(document).ready(function() {
    // Function to fetch and display data based on selected category
    function fetchFoodData(category) {
        $.ajax({
            url: 'fetch_food.php',
            method: 'POST',
            data: { category: category },
            success: function(response) {
                var foodData = JSON.parse(response);
                var dynamicContent = $('.dynamic-content');
                dynamicContent.empty();

                if (foodData.length > 0) {
                    $.each(foodData, function(index, food) {
                        var foodItem = `
                            <div class="food-item">
                                <div class="image-container">
                                    <img src="${food.Image}" alt="${food.FoodName}" class="small-image">
                                </div>
                                <div class="info-container">
                                    <h3>${food.FoodName}</h3>
                                    <p><strong>Cost:</strong> $${food.Price}</p>
                                    <p><strong>Restaurant:</strong> ${food.Restaurant}</p>
                                              
<p><a href="firstfood.php? foodid="${food.id}" class="see-more-link">See More</a></p>
                                   
                                </div>
                            </div>
                        `;
                        dynamicContent.append(foodItem);
                    });

                    // Event handler for "See More" link
                    $('.see-more-link').click(function(e) {
                        e.preventDefault();
                        var index = $(this).data('index');
                        var additionalInfo = $('.food-item').eq(index).find('.additional-info');
                        additionalInfo.slideToggle();
                    });
                } else {
                    dynamicContent.html('<p>No food items found.</p>');
                }
            },
            error: function(xhr, status, error) {
                console.error(error);
            }
        });
    }
    
   

    // Event handler for category selection
    $('.category-list a').click(function(e) {
        e.preventDefault();
        $('.category-list a').removeClass('active');
        $(this).addClass('active');
        var category = $(this).data('category');
        fetchFoodData(category);
    });

    // Initial fetch for 'all' category
    fetchFoodData('all');
});
</script>
